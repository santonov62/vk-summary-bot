name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два развёртывания одновременно
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Проверка синтаксиса
        run: for f in src/*.js; do node --check "$f"; done

      - name: Настройка SSH и .env
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf '%s\n' "$ENV_FILE" > .env

      - name: Развёртывание
        run: ./deploy/deploy.sh

      - name: Удаление секретов
        if: always()
        run: rm -f .env ~/.ssh/id_ed25519
